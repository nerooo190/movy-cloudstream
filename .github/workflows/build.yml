name: Cloudstream-Erweiterung bauen

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: movy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Schnittstellen testen
        working-directory: server
        run: |
          npm ci
          npm test
      - name: Server-Container starten und Manifest prüfen
        run: |
          docker build -t movy-resolver ./server
          docker run --detach --init --name movy-resolver -p 127.0.0.1:17000:7000 \
            -e MOVY_ACCESS_TOKEN='test+fixture/padding=' movy-resolver
          trap 'docker logs movy-resolver; docker rm -f movy-resolver' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 2 --fail --silent --show-error http://127.0.0.1:17000/health
          curl --fail --silent --show-error http://127.0.0.1:17000/test-fixture_padding/manifest.json |
            jq -e '.id == "de.movy.stremio"'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android-SDK installieren
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Plugin und Repository bauen
        run: |
          ./gradlew make makePluginsJson makeRepositoryJson
          mkdir -p package
          cp Movy/build/Movy.cs3 build/{plugins,repo}.json package/
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          package = Path("package")
          base_url = f"https://cdn.jsdelivr.net/gh/{os.environ['GITHUB_REPOSITORY']}@builds"
          repository = json.loads((package / "repo.json").read_text())
          plugin, = json.loads((package / "plugins.json").read_text())

          version = plugin["version"]
          digest = plugin["fileHash"].removeprefix("sha256-")
          binary = f"Movy-{digest}.cs3"
          shutil.copyfile(package / "Movy.cs3", package / binary)
          plugin["url"] = f"{base_url}/{binary}"

          plugin_list = f"plugins-v{version}-cdn.json"
          repository["pluginLists"] = [f"{base_url}/{plugin_list}"]
          for filename in ("plugins-cdn.json", plugin_list):
              (package / filename).write_text(json.dumps([plugin], indent=2) + "\n")

          (package / "repo-cdn.json").write_text(json.dumps(repository, indent=2) + "\n")
          repository["name"] = f"{repository['name']} (v{version})"
          (package / f"repo-v{version}-cdn.json").write_text(json.dumps(repository, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: movy-cloudstream
          path: package/
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: movy-cloudstream
          path: ${{ runner.temp }}/movy-package
      - name: Repository-Dateien auf builds veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/movy-builds"
          build_ref=$(git ls-remote --heads origin refs/heads/builds)
          if [[ -n "$build_ref" ]]; then
            git fetch --no-tags origin refs/heads/builds
            git worktree add --detach "$target" FETCH_HEAD
          else
            git worktree add --detach "$target" HEAD
            git -C "$target" switch --orphan builds
          fi

          cp "$RUNNER_TEMP"/movy-package/* "$target/"
          git -C "$target" add --all
          if git -C "$target" diff --cached --quiet; then
            exit 0
          fi
          git -C "$target" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Build Movy from $GITHUB_SHA"
          git -C "$target" push origin HEAD:refs/heads/builds
