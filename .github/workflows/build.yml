name: Cloudstream-Erweiterung bauen

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: movy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android-SDK installieren
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Plugin und Repository bauen
        run: |
          ./gradlew make makePluginsJson makeRepositoryJson
          mkdir -p package
          cp Movy/build/Movy.cs3 build/{plugins,repo}.json package/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          package = Path("package")
          base_url = f"https://cdn.jsdelivr.net/gh/{os.environ['GITHUB_REPOSITORY']}@builds"
          repository = json.loads((package / "repo.json").read_text())
          plugins = json.loads((package / "plugins.json").read_text())

          repository["pluginLists"] = [f"{base_url}/plugins-cdn.json"]
          for plugin in plugins:
              filename = plugin["url"].rsplit("/", 1)[-1]
              plugin["url"] = f"{base_url}/{filename}"

          (package / "repo-cdn.json").write_text(json.dumps(repository, indent=2) + "\n")
          (package / "plugins-cdn.json").write_text(json.dumps(plugins, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: movy-cloudstream
          path: package/
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: movy-cloudstream
          path: ${{ runner.temp }}/movy-package
      - name: Repository-Dateien auf builds veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/movy-builds"
          build_ref=$(git ls-remote --heads origin refs/heads/builds)
          if [[ -n "$build_ref" ]]; then
            git fetch --no-tags origin refs/heads/builds
            git worktree add --detach "$target" FETCH_HEAD
          else
            git worktree add --detach "$target" HEAD
            git -C "$target" switch --orphan builds
          fi

          files=(Movy.cs3 plugins.json repo.json plugins-cdn.json repo-cdn.json)
          for file in "${files[@]}"; do
            cp "$RUNNER_TEMP/movy-package/$file" "$target/"
          done
          git -C "$target" add -- "${files[@]}"
          if git -C "$target" diff --cached --quiet; then
            exit 0
          fi
          git -C "$target" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Build Movy from $GITHUB_SHA"
          git -C "$target" push origin HEAD:refs/heads/builds
